<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slide Class Diagram</title>
    <style>
        :root {
            --bg: #101114;
            --panel: #191b21;
            --panel-2: #242832;
            --text: #f3f5f7;
            --muted: #aeb5c2;
            --accent: #4da3ff;
            --border: #343946;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .meta {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .stage {
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 260px;
        }

        .viewer {
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .image-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid var(--border);
            overflow: auto;
        }

        .image-wrap img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 32px;
        }

        .caption strong {
            font-size: 16px;
        }

        .caption a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }

        aside {
            min-height: 0;
            overflow: auto;
            border-left: 1px solid var(--border);
            background: var(--panel);
            padding: 12px;
        }

        .thumb {
            width: 100%;
            display: grid;
            grid-template-columns: 56px 1fr;
            gap: 10px;
            align-items: center;
            padding: 8px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            text-align: left;
        }

        .thumb + .thumb {
            margin-top: 8px;
        }

        .thumb img {
            width: 56px;
            height: 42px;
            object-fit: cover;
            background: #fff;
            border: 1px solid var(--border);
        }

        .thumb span {
            font-size: 13px;
            line-height: 1.3;
        }

        .thumb.active {
            border-color: var(--accent);
            background: var(--panel-2);
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        button {
            min-width: 92px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel-2);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            border-color: var(--accent);
        }

        .progress {
            width: min(360px, 35vw);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #303541;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: var(--accent);
        }

        @media (max-width: 900px) {
            .stage {
                grid-template-columns: 1fr;
            }

            aside {
                display: flex;
                overflow-x: auto;
                border-left: 0;
                border-top: 1px solid var(--border);
            }

            .thumb {
                min-width: 210px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <h1>Slide Class Diagram</h1>
            <div class="meta"><span id="counter"></span> · Phím ←/→ để chuyển slide</div>
        </header>

        <section class="stage">
            <div class="viewer">
                <div class="image-wrap">
                    <img id="mainImage" alt="Class diagram">
                </div>
                <div class="caption">
                    <strong id="title"></strong>
                    <a id="openLink" href="#" target="_blank" rel="noopener">Mở ảnh gốc</a>
                </div>
            </div>
            <aside id="thumbs" aria-label="Danh sách chủ đề"></aside>
        </section>

        <footer>
            <button id="prevBtn" type="button">Trước</button>
            <button id="playBtn" type="button">Tạm dừng</button>
            <button id="nextBtn" type="button">Sau</button>
            <div class="progress" aria-hidden="true">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </footer>
    </main>

    <script>
        const slides = [
            { title: "01 - Quản lý thư viện", src: "ChuDe_01_QuanLyThuVien/Class_Diagram.png" },
            { title: "02 - Quản lý đào tạo", src: "ChuDe_02_QuanLyDaoTao/Class_Diagram.png" },
            { title: "03 - Quản lý tour du lịch", src: "ChuDe_03_QuanLyTourDuLich/Class_Diagram.png" },
            { title: "04 - Quản lý nhà hàng", src: "ChuDe_04_QuanLyNhaHang/Class_Diagram.png" },
            { title: "05 - Quản lý kho vật tư", src: "ChuDe_05_QuanLyKhoVatTu/Class_Diagram.png" },
            { title: "06 - Quản lý giải đấu cờ vua", src: "ChuDe_06_QuanLyGiaiDauCoVua/Class_Diagram.png" },
            { title: "07 - Quản lý giải đua F1", src: "ChuDe_07_QuanLyGiaiDuaF1/Class_Diagram.png" },
            { title: "08 - Quản lý cửa hàng truyện", src: "ChuDe_08_QuanLyCuaHangTruyen/Class_Diagram.png" },
            { title: "09 - Quản lý nhân viên parttime Lotteria", src: "ChuDe_09_QuanLyNhanVienParttimeLotteria/Class_Diagram.png" },
            { title: "10 - Quản lý rạp chiếu phim", src: "ChuDe_10_QuanLyRapChieuPhim/Class_Diagram.png" },
            { title: "11 - Quản lý sân bóng mini", src: "ChuDe_11_QuanLySanBongMini/Class_Diagram.png" },
            { title: "12 - Quản lý vay trả góp Saison", src: "ChuDe_12_QuanLyVayTraGopSaison/Class_Diagram.png" },
            { title: "13 - Quản lý cho thuê trang phục", src: "ChuDe_13_QuanLyChoThueTrangPhuc/Class_Diagram.png" }
        ];

        const mainImage = document.getElementById("mainImage");
        const title = document.getElementById("title");
        const counter = document.getElementById("counter");
        const openLink = document.getElementById("openLink");
        const thumbs = document.getElementById("thumbs");
        const progressBar = document.getElementById("progressBar");
        const playBtn = document.getElementById("playBtn");
        const intervalMs = 5000;

        let index = 0;
        let playing = true;
        let timerId = null;
        let progressId = null;
        let startedAt = Date.now();

        function renderThumbs() {
            thumbs.innerHTML = "";
            slides.forEach((slide, i) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "thumb";
                button.innerHTML = `<img src="${slide.src}" alt=""><span>${slide.title}</span>`;
                button.addEventListener("click", () => showSlide(i));
                thumbs.appendChild(button);
            });
        }

        function showSlide(nextIndex) {
            index = (nextIndex + slides.length) % slides.length;
            const slide = slides[index];
            mainImage.src = slide.src;
            title.textContent = slide.title;
            counter.textContent = `${index + 1}/${slides.length}`;
            openLink.href = slide.src;

            document.querySelectorAll(".thumb").forEach((thumb, i) => {
                thumb.classList.toggle("active", i === index);
            });

            resetProgress();
        }

        function nextSlide() {
            showSlide(index + 1);
        }

        function prevSlide() {
            showSlide(index - 1);
        }

        function resetProgress() {
            startedAt = Date.now();
            progressBar.style.width = "0";
        }

        function startAutoPlay() {
            stopAutoPlay();
            playing = true;
            playBtn.textContent = "Tạm dừng";
            startedAt = Date.now();
            timerId = setInterval(nextSlide, intervalMs);
            progressId = setInterval(() => {
                const ratio = Math.min((Date.now() - startedAt) / intervalMs, 1);
                progressBar.style.width = `${ratio * 100}%`;
            }, 80);
        }

        function stopAutoPlay() {
            playing = false;
            clearInterval(timerId);
            clearInterval(progressId);
            timerId = null;
            progressId = null;
            playBtn.textContent = "Tự chạy";
        }

        document.getElementById("nextBtn").addEventListener("click", nextSlide);
        document.getElementById("prevBtn").addEventListener("click", prevSlide);
        playBtn.addEventListener("click", () => playing ? stopAutoPlay() : startAutoPlay());

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowRight") nextSlide();
            if (event.key === "ArrowLeft") prevSlide();
            if (event.key === " ") {
                event.preventDefault();
                playing ? stopAutoPlay() : startAutoPlay();
            }
        });

        renderThumbs();
        showSlide(0);
        startAutoPlay();
    </script>
</body>
</html>
